[project]
name = "openbuddy-k10"
version = "0.1.0"
description = "AI voice companion server for Seeed XIAO ESP32S3 Sense (xiaozhi protocol) with a Claude Agent brain"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "claude-agent-sdk>=0.1.0",
]

[project.optional-dependencies]
# Phase 1 — local/free voice
local-voice = [
    "edge-tts>=6.1",
    "funasr>=1.1",      # SenseVoice STT (also pulls torch — heavy)
]
# Phase 2 — OpenBuddy parity
elevenlabs = [
    "elevenlabs>=1.0",
]
# Opus codec (needed once you turn on real audio)
audio = [
    "opuslib>=3.0",     # requires libopus installed on the system
    "numpy>=1.26",
]

[project.scripts]
openbuddy-k10 = "openbuddy_k10.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["openbuddy_k10*"]
